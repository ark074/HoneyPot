# Prometheus Configuration for AegisTrap
# Scrapes metrics from the honeypot dashboard API

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aegistrap"
    static_configs:
      - targets: ["aegistrap-app:9000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
