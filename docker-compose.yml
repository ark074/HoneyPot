###############################################################################
# AegisTrap - Docker Compose Orchestration
# 
# CORE SERVICES (start by default):
# 1. ollama-service:    Local LLM runtime (llama3:8b)
# 2. aegistrap-app:    Multi-service honeypot application
# 3. redis:            Caching, pub/sub, session state
#
# OPTIONAL MONITORING (start with --profile monitoring):
# 4. elasticsearch:    Log storage and search
# 5. grafana:          Metrics visualization dashboards
# 6. prometheus:       Metrics collection
#
# Usage:
#   docker compose up -d                           # Core only (recommended)
#   docker compose --profile monitoring up -d      # Core + monitoring stack
#   docker compose logs -f aegistrap-app           # Follow honeypot logs
#   docker compose down                            # Stop everything
###############################################################################

services:
  # ===========================================================================
  # Ollama LLM Service
  # ===========================================================================
  ollama-service:
    image: ollama/ollama:latest
    container_name: aegistrap-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - aegistrap-net

  # ===========================================================================
  # Redis - In-Memory Cache & Pub/Sub
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: aegistrap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aegistrap-net

  # ===========================================================================
  # AegisTrap Honeypot Application (CORE)
  # ===========================================================================
  aegistrap-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegistrap-honeypot
    restart: unless-stopped
    depends_on:
      ollama-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "22:2222"
      - "23:23"
      - "80:80"
      - "8080:8080"
      - "21:21"
      - "9000:9000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data:ro
    environment:
      - OLLAMA_HOST=http://ollama-service:11434
      - OLLAMA_MODEL=llama3:8b
      - LOG_DIR=/app/logs
      - SSH_PORT=2222
      - TELNET_PORT=23
      - HTTP_PORT=80
      - HTTP_ALT_PORT=8080
      - FTP_PORT=21
      - REDIS_URL=redis://redis:6379/0
      - DASHBOARD_PORT=9000
      - GEOIP_CITY_DB=/app/data/geoip/GeoLite2-City.mmdb
      - GEOIP_ASN_DB=/app/data/geoip/GeoLite2-ASN.mmdb
      - YARA_RULES_DIR=/app/data/yara_rules
    networks:
      - aegistrap-net

  # ===========================================================================
  # OPTIONAL: Elasticsearch (use --profile monitoring)
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: aegistrap-elasticsearch
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=aegistrap
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - aegistrap-net

  # ===========================================================================
  # OPTIONAL: Prometheus (use --profile monitoring)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: aegistrap-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - aegistrap-net

  # ===========================================================================
  # OPTIONAL: Grafana (use --profile monitoring)
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: aegistrap-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=aegistrap
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - aegistrap-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  ollama_models:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  aegistrap-net:
    driver: bridge
